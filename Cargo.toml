
[package]
name = "zfetch"
version = "0.1.0"
edition = "2024"

description = "A fast, lightweight and customizable Linux system information tool written in Rust"
license = "MIT"

repository = "https://github.com/azislamayuda/zfetch"
homepage = "https://github.com/azislamayuda/zfetch"
readme = "README.md"

keywords = ["linux", "system-information", "fastfetch", "cli"]
categories = ["command-line-utilities"]

[dependencies]
json5 = "1.3"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
zbus = "5.19.0"

# ============================================
# ZFETCH RELEASE OPTIMIZATION
# ============================================

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

# Experimental compact build
[profile.compact]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

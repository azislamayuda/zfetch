
[package]
name = "zfetch"
version = "0.4.0"
edition = "2024"

description = "A fast, lightweight and customizable Linux system information tool written in Rust"
license = "MIT"

repository = "https://github.com/azislamayuda/zfetch"
homepage = "https://github.com/azislamayuda/zfetch"
readme = "README.md"

keywords = ["linux", "system-information", "fastfetch", "cli"]
categories = ["command-line-utilities"]

[dependencies]
serde_json = "1"

json5 = "1.3"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
zbus = "5.19.0"

# ============================================
# ZFETCH RELEASE OPTIMIZATION
# ============================================

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

# Experimental compact build
[profile.compact]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

# ============================================
# ZFETCH DEBIAN PACKAGE
# ============================================

[package.metadata.deb]

maintainer = "Azis Lamayuda"
copyright = "2026 Azis Lamayuda"

license-file = ["LICENSE", "0"]

section = "utils"
priority = "optional"

# Detect runtime library dependencies.
depends = "apt, curl, coreutils, dpkg, $auto"

# Use our optimized compact Rust profile.
profile = "compact"

# Files included in the Debian package.


extended-description = """
zfetch is a fast and lightweight Linux system information
tool written in Rust.

It displays operating system, hardware, memory, disk,
network, desktop environment, and package information.

Features include JSONC configuration, automatic distro ASCII logos,
terminal colors, and optimized system detection.
"""

assets = [
    ["target/release/zfetch", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/zfetch/README.md", "644"],
    ["LICENSE", "usr/share/doc/zfetch/LICENSE", "644"],
    ["docs/licenses/fastfetch-MIT.txt", "usr/share/doc/zfetch/fastfetch-MIT.txt", "644"],
    ["docs/THIRD_PARTY_LOGOS.md", "usr/share/doc/zfetch/THIRD_PARTY_LOGOS.md", "644"],
]


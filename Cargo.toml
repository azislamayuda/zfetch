[package]
name = "zfetch"
version = "0.1.0"
edition = "2024"

[dependencies]
json5 = "1.3"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
zbus = "5.19.0"

# ============================================
# ZFETCH RELEASE OPTIMIZATION
# ============================================

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

# Experimental compact build
[profile.compact]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

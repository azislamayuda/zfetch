name: Debian package builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Debian package on Ubuntu 22.04 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Install Ubuntu 22.04 build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config file binutils python3

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Validate Rust source
        run: |
          rustup component add clippy rustfmt
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build Debian package
        run: |
          cargo deb --locked --profile compact
          bash packaging/check-glibc.sh target/compact/zfetch 2.35
          mkdir -p dist
          cp target/debian/*.deb dist/
          cd dist
          sha256sum *.deb > "SHA256SUMS-${{ matrix.arch }}"

      - name: Validate Debian package and installation
        env:
          EXPECTED_DEB_ARCH: ${{ matrix.arch }}
        run: |
          deb_file=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb_file"
          test "$(dpkg-deb -f "$deb_file" Package)" = zfetch
          test "$(dpkg-deb -f "$deb_file" Architecture)" = "$EXPECTED_DEB_ARCH"
          apt-get install -y "./$deb_file"
          zfetch --version
          zfetch --no-logo --no-color > /dev/null
          zfetch --format json --privacy | python3 -m json.tool > /dev/null

      - name: Upload Debian package
        uses: actions/upload-artifact@v6
        with:
          name: zfetch-deb-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

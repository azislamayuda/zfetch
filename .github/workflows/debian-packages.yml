name: Debian package builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install packaging tool
        run: cargo install cargo-deb --locked
      - name: Validate
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked
      - name: Build Debian package
        run: |
          cargo deb --locked --profile compact
          mkdir -p dist
          cp target/debian/*.deb dist/
          cd dist
          sha256sum *.deb > "SHA256SUMS-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v6
        with:
          name: zfetch-deb-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

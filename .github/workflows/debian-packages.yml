
name: Debian package builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Build Debian package (${{ matrix.arch }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install packaging tool
        run: cargo install cargo-deb --locked

      - name: Validate Rust source
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build Debian package
        run: |
          cargo deb --locked --profile compact
          mkdir -p dist
          cp target/debian/*.deb dist/
          cd dist
          sha256sum *.deb > "SHA256SUMS-${{ matrix.arch }}"

      - name: Upload Debian package
        uses: actions/upload-artifact@v6
        with:
          name: zfetch-deb-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

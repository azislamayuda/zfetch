name: Portable musl Linux builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Static musl tarball (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools binutils file python3

      - name: Install Rust musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test source on native runner
        run: cargo test --locked

      - name: Build static musl binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --locked --profile compact --target "${{ matrix.target }}"

      - name: Verify static linking, smoke-test and package
        env:
          PKG_ARCH: ${{ matrix.arch }}
          MUSL_TARGET: ${{ matrix.target }}
        run: bash packaging/build-musl-portable.sh

      - name: Upload static portable artifacts
        uses: actions/upload-artifact@v6
        with:
          name: zfetch-musl-${{ matrix.arch }}
          path: dist/*musl*
          if-no-files-found: error
          retention-days: 14
